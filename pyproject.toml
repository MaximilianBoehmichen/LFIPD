[project]
name = "lfipd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maximilian Böhmichen", email = "34962223+MaximilianBoehmichen@users.noreply.github.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "beartype>=0.23.1",
    "huggingface-hub>=2.4.0",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.2",
    "nibabel>=5.5.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pydicom>=3.0.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[project.scripts]
lfipd = "lfipd:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
